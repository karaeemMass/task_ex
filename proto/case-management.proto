// Case Info - represents a legal case

// القضية نفسها
message CaseSubject {
  string id = 1; // معرف القضية
  CaseNumber case_number = 2; // رقم القضية
  CheckNumber check_number = 3; // رقم المحضر
  PenaltyDecisionNumber penalty_decision_number = 4; // رقم القرار التأديبي
  string case_number_ref = 5; // رقم القضية بالصيغة النصية
  string check_number_ref = 6; // رقم المحضر بالصيغة النصية
  string penalty_decision_number_ref = 7; // رقم القرار التأديبي بالصيغة النصية
  optional string judgement_number = 8; // رقم الحكم
  optional string case_inv_number = 9;
  string case_type = 10; // نوع القضية
  CaseStatus status = 11; // حالة القضية
  optional SeverityLevel severity = 12; // شدة القضية
  optional string title = 13; // عنوان القضية
  optional string description = 14; // وصف القضية
  optional int64 incident_date = 15;        // تاريخ الواقعة
  optional int64 judgement_date = 16;    // تاريخ الحكم
  optional int64 disciplinary_decision_date = 17; // تاريخ القرار التأديبي
  string site_id = 18; // جهة الاختصاص
  string site_name = 19; // الجهة الحكومية
  optional string notes = 20; // ملاحظات إضافية
  optional string created_by = 21; // المستخدم الذي أنشأ القضية
  int64 created_at = 22; // تاريخ الإنشاء
  int64 updated_at = 23; // تاريخ التحديث
  repeated CaseDefendant case_defendants = 24; // المتهمين في القضية
  repeated Document documents = 25; // المستندات المتعلقة بالقضية
  repeated CaseTask tasks = 26; // المهام المتعلقة بالقضية
  int32 total_pages = 27;
  SOURCE_TYPE source_type = 28;
  DECISION_TYPE decision_type = 29;
  repeated CaseDefendantCitizen history_citizen = 30;
  optional int64 judgment_case_number = 31;
  optional int64 judgment_case_year = 32;
  optional string court_id = 33;
  optional string scan_user = 34;
  optional string scan_user_name = 35;
  optional string approve_user_scan = 36;
  optional string approve_user_scan_name = 37;
  optional string meta_user = 38;
  optional string meta_user_name = 39;
  optional string approve_user = 40;
  optional string approve_user_name = 41;
  optional bool can_remove_task = 42;
  string prosecution_name = 43;
  string governorate_name = 44;
}

message CaseDefendantCitizen {
  Citizen citizen = 1;
  repeated CaseDefendant case_defendants = 2;
}

// مصدر القضية
enum SOURCE_TYPE {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_REPORT = 1;
  SOURCE_TYPE_COMPLAINT = 2;
}

// نوع القرار
enum DECISION_TYPE {
  DECISION_TYPE_UNSPECIFIED = 0;
  DECISION_TYPE_DISCIPLINARY = 1;
  DECISION_TYPE_VERDICT = 2;
  DECISION_TYPE_SAVE = 3;
}

// نوع الحفظ
enum SAVE_TYPE {
  SAVE_TYPE_UNSPECIFIED = 0;
  SAVE_TYPE_NO_VIOLATION = 1;
  SAVE_TYPE_INVALIDITY = 2;
  SAVE_TYPE_IRRELEVANCE = 3;
  SAVE_TYPE_INSUFFICIENT = 4;
}

// حالة القضية
enum CaseStatus {
  CASE_STATUS_UNSPECIFIED = 0;
  CASE_STATUS_UNDER_ENTRY = 1; // تحت القيد
  CASE_STATUS_UNDER_INVESTIGATION = 2; // قيد التحقيق
  CASE_STATUS_CLOSED = 3; // مغلقة
  CASE_STATUS_APPEALED = 4; // مستأنفة
}

// المتهم في القضية
message CaseDefendant {
  Citizen citizen = 1;
  // one of verdict or disciplinary decision
  optional string verdict_id = 2;
  optional string verdict_description = 3;
  optional string disciplinary_decision_id = 4;
  optional string disciplinary_decision_description = 5;
  repeated AdditionalField verdict_fields = 6;
  optional string notes = 7;
  repeated CaseCrime crimes = 8;
  DECISION_TYPE decision_type = 9;
  SAVE_TYPE save_type = 10;
  optional string advoice = 11;
  optional string case_defendant_id = 12;
  optional int64 created_at = 13;
  optional int64 count_history = 14;
  optional bool is_original = 15;
  optional ObjectionCase objection = 16;
  optional int64 real_date = 17;
}

message ObjectionCase {
  string id = 1;
  optional ObjectionStatus status = 2;
  ObjectionType objection_type = 3;
  optional string objection_number = 4;
  optional int64 objection_date = 5;
  optional string description = 6;
}


// جريمة في القضية
message CaseCrime {
  string id = 1;
  string description = 2;
}

message RejectedDocument {
  string id = 1;
