syntax = "proto3";

option go_package = "github.com/mas-soft/case-management/api;api";

package casemanagement.v1;

// import "google/protobuf/struct.proto";

// ============================================================================
// =============================  ENUMS  ======================================
// ============================================================================

// SeverityLevel represents the severity level of cases, crimes, and verdicts
enum SeverityLevel {
  SEVERITY_LEVEL_UNSPECIFIED = 0;
  SEVERITY_LEVEL_LOW = 1; // منخفض
  SEVERITY_LEVEL_MODERATE = 2; // متوسط
  SEVERITY_LEVEL_HIGH = 3; // عالي
  SEVERITY_LEVEL_CRITICAL = 4; // حرج
}

// CaseTypeCategory represents the category of case type
enum CaseTypeCategory {
  CASE_TYPE_CATEGORY_UNSPECIFIED = 0;
  CASE_TYPE_CATEGORY_CRIMINAL = 1; // جنائي
  CASE_TYPE_CATEGORY_CIVIL = 2; // مدني
}

// EmploymentStatus represents the employment status of citizens
// حالة التوظيف
enum EmploymentStatus {
  EMPLOYMENT_STATUS_UNSPECIFIED = 0;
  EMPLOYMENT_STATUS_ACTIVE = 1; // نشط
  EMPLOYMENT_STATUS_INACTIVE = 2; // غير نشط
  EMPLOYMENT_STATUS_SUSPENDED = 3; // موقوف
  EMPLOYMENT_STATUS_RETIRED = 4; // متقاعد
}

// VerdictType represents the type of verdict
// نوع الحكم
enum VerdictType {
  VERDICT_TYPE_UNSPECIFIED = 0;
  VERDICT_TYPE_ACQUITTAL = 1; // براءة
  VERDICT_TYPE_CONVICTION = 2; // إدانة
}
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}
// VerdictCategory represents the category of verdict
// فئة الحكم
enum VerdictCategory {
  VERDICT_CATEGORY_UNSPECIFIED = 0;
  VERDICT_CATEGORY_DISCIPLINARY = 1; // تأديبي
  VERDICT_CATEGORY_ADMINISTRATIVE = 2; // إداري
  VERDICT_CATEGORY_CRIMINAL = 3; // جنائي
}

// InputType represents the type of input field for additional verdict data
// نوع حقل الإدخال
enum InputType {
  INPUT_TYPE_UNSPECIFIED = 0;
  INPUT_TYPE_TEXT = 1; // نص
  INPUT_TYPE_NUMBER = 2; // رقم
  INPUT_TYPE_TEXTAREA = 3; // نص طويل
  INPUT_TYPE_SELECT = 4; // قائمة منسدلة
}

enum InputUnit {
  UNIT_UNSPECIFIED = 0;
  UNIT_DAYS = 1;
  UNIT_WEEKS = 2;
  UNIT_MONTHS = 3;
  UNIT_YEARS = 4;
}


enum DisciplinaryCategory {
  DISCIPLINARY_CATEGORY_UNSPECIFIED = 0;
  DISCIPLINARY_CATEGORY_WARNING = 1; // إنذار
  DISCIPLINARY_CATEGORY_SUSPENSION = 2; // إيقاف مؤقت
  DISCIPLINARY_CATEGORY_TERMINATION = 3; // فصل نهائي
  DISCIPLINARY_CATEGORY_OTHER = 4;
}

enum CaseRquestType {
  CASE_TYPE_NULL = 0;
  CASE_TYPE_COMPLAINT = 1;
  CASE_TYPE_REPORT = 2;
}
enum LegalDocumentType {
  // غير محدد (القيمة الافتراضية)
  LEGAL_DOCUMENT_TYPE_UNSPECIFIED = 0;
  // مذكرة النيابة
  PROSECUTION_MEMORANDUM = 1;
  // نموذج الفحص
  INSPECTION_FORM = 2;
  // القرار التأديبي
  DISCIPLINARY_DECISION = 3;
  // القرار التنفيذي
  EXECUTIVE_DECISION = 4;
  // مذكرة الطعن
  APPEAL_MEMORANDUM = 5;
  // حكم المحكمة
  COURT_JUDGMENT = 6;
  // تظلم
  GRIEVANCE_PETITION = 7;
  // صوره بطاقه
  ID_CARD_PHOTO = 8;
  // تقرير الاتهام
  ACCUSATION_REPORT = 9;
}


enum RequestType {
  REQUEST_TYPE_NULL = 0;
  REQUEST_TYPE_VERIFY_DATA_ENTRY = 1; // يتم من الاسكان الي محقق الورق
  REQUEST_TYPE_DATA_ENTRY = 2; // يتم من محقق الورق الي مدخل البيانات
  REQUEST_TYPE_SCAN = 3; // يتم  ارجاعه الي عمليه الاسكان
  REQUEST_TYPE_REVIEW = 4; // يتم من مدخل البيانات الي المحقق النهائي للقضيه
  REQUEST_TYPE_APPROVED = 5; // يتم من المحقق النهائي  لاعتماده بالنظام
  REQUEST_TYPE_INFO_DATA = 6; // يتم من المحقق النهائي او النظام لاستكمال بيانات ما بعد الميتا كطعن او قرار تنفيذي
  REQUEST_TYPE_REMOVE_LAST_TASK = 7; // حذف التاسك الاخيره
  REQUEST_TYPE_REMOVE_TO_FIRST_TASK = 8; // العوده الي التاسك الاول
}
enum ActionType {
  ACTION_TYPE_NULL = 0;
  ACTION_TYPE_SCAN = 1;
  ACTION_TYPE_APPROVE_SCAN = 2;
  ACTION_TYPE_REJECT_SCAN = 3;
  ACTION_TYPE_POST_META = 4;
  ACTION_TYPE_APPROVE_META = 5;
  ACTION_TYPE_REJECT_META = 6;
  ACTION_TYPE_POST_INFO_OBJECTION = 7;
  ACTION_TYPE_POST_INFO_EXECUTION = 8;
  ACTION_TYPE_REMOVE_TASKS = 9;
  ACTION_TYPE_REJECT_APPROVE_SCAN = 10;
}
// ============================================================================
// SERVICES
// ============================================================================

// CaseTypesService handles case types, crime types, verdicts, and citizens
service CaseManagementService {

  // New RPC for Employee Target Report
  rpc GetEmpTargetReports(GetEmpTargetReportsRequest) returns (GetEmpTargetReportsResponse);

  // for maintainance
  rpc ListUsers(Empty) returns (ListUserResponse);
  // Case Types
  rpc ListCaseTypes(ListCaseTypesRequest) returns (ListCaseTypesResponse);
  rpc GetCaseType(GetCaseTypeRequest) returns (CaseType);
  rpc CreateCaseType(CreateCaseTypeRequest) returns (CaseType);
  rpc UpdateCaseType(UpdateCaseTypeRequest) returns (CaseType);
  rpc DeleteCaseType(DeleteCaseTypeRequest) returns (Empty);

  // Crime Types
  rpc ListCrimeTypes(ListCrimeTypesRequest) returns (ListCrimeTypesResponse);
  rpc GetCrimeType(GetCrimeTypeRequest) returns (CrimeType);
  rpc CreateCrimeType(CreateCrimeTypeRequest) returns (CrimeType);
  rpc UpdateCrimeType(UpdateCrimeTypeRequest) returns (CrimeType);
  rpc DeleteCrimeType(DeleteCrimeTypeRequest) returns (Empty);

  // Crime Types
  rpc ListSettings(Empty) returns (ListSettingsResponse);
  rpc GetSetting(GetSettingRequest) returns (Setting);
  rpc UpdateSetting(Setting) returns (Empty);

  // Verdicts
  rpc ListVerdicts(ListVerdictsRequest) returns (ListVerdictsResponse);
  rpc GetVerdict(GetVerdictRequest) returns (Verdict);
  rpc CreateVerdict(CreateVerdictRequest) returns (Verdict);
  rpc UpdateVerdict(UpdateVerdictRequest) returns (Verdict);
  rpc DeleteVerdict(DeleteVerdictRequest) returns (Empty);

  // Disciplinary Decisions
  rpc ListDisciplinaryDecisions(ListDisciplinaryDecisionsRequest) returns (ListDisciplinaryDecisionsResponse);
  rpc GetDisciplinaryDecision(GetDisciplinaryDecisionRequest) returns (DisciplinaryDecision);
  rpc CreateDisciplinaryDecision(CreateDisciplinaryDecisionRequest) returns (DisciplinaryDecision);
  rpc UpdateDisciplinaryDecision(UpdateDisciplinaryDecisionRequest) returns (DisciplinaryDecision);
  rpc DeleteDisciplinaryDecision(DeleteDisciplinaryDecisionRequest) returns (Empty);

  // Citizens
  rpc ListCitizens(ListCitizensRequest) returns (ListCitizensResponse);
  rpc GetCitizen(GetCitizenRequest) returns (Citizen);
  rpc CreateCitizen(CreateCitizenRequest) returns (Citizen);
  rpc UpdateCitizen(UpdateCitizenRequest) returns (Citizen);
  rpc DeleteCitizen(DeleteCitizenRequest) returns (Empty);
  rpc SearchCitizensByName(SearchCitizensByNameRequest) returns (SearchCitizensByNameResponse);

  // case execute decision
  rpc ListExecutDecision(ListExecutDecisionRequest) returns (ListExecutDecisionResponse);
  rpc ListCasesWithoutExecutDecision(Empty) returns (GetCasesResponse);
  rpc ListCasesWithoutAllExecutDecision(Empty) returns (GetCasesResponse);
  rpc GetExecutDecision(GetExecutDecisionRequest) returns (ExecutDecision);
  rpc CreateExecutDecision(CreateExecutDecisionRequest) returns (CreateExecutDecisionRequest);
  rpc UpdateExecutDecision(ExecutDecision) returns (ExecutDecision);
  rpc DeleteExecutDecision(DeleteExecutDecisionRequest) returns (Empty);

  // Case Request
  rpc GetCase(GetCaseRequest) returns (CaseSubject);
  rpc GetCaseDetail(GetCaseRequest) returns (CaseSubjectDetail);
  rpc GetRejectedCases(RejectedCasesRequest) returns (RejectedCasesResponse);
  rpc GetHistoryCasesRequest(ListHistoryCasesRequset) returns (ListHistoryCasesResponse);
  rpc GetListCasesRequest(ListCasesRequest) returns (ListCasesResponse);
  rpc VerifyScanCaseApplication(VerifyCaseApplicationRequest) returns (VerifyScanCaseApplicationResponse);
  rpc ApproveScanCaseApplication(ApproveScanCaseApplicationRequest) returns (ApproveScanCaseApplicationResponse);
  rpc RejectScanCaseApplication(RejectScanCaseApplicationRequest) returns (RejectScanCaseApplicationResponse);
  rpc RejectApproveScanCaseApplication(RejectApproveScanCaseApplicationRequest) returns (RejectApproveScanCaseApplicationResponse);
  rpc PostMetaDataCaseApplication(PostMetaDataCaseApplicationRequest) returns (PostMetaDataCaseApplicationResponse);
  rpc ReviewCaseApplication(ReviewCaseApplicationRequest) returns (ReviewCaseApplicationResponse);
  rpc GetCases(GetCasesRequest) returns (GetCasesResponse);
  rpc SaveDocuments(SaveDocumentsRequest) returns (Empty);
  rpc DeleteDocument(DeleteDocumentRequest) returns (Empty);
  rpc GetCasesInUserTaskRun(GetCasesInUserTaskRunRequest) returns (GetCasesInUserTaskRunResponse);
  rpc RemoveTasksCases(RemoveTasksCasesRequest) returns (Empty);
  rpc SaveDraftRequest(DraftRequest) returns (Empty);
  rpc GetDraft(GetDraftRequest) returns (DraftRequest);

  // record requests
  rpc SendRequestForDisciplinaryRecordCitizen(SendRequestForRecordRequest) returns (SendRequestForRecordResponse);
  rpc GetDisciplinaryRecordRequests(DisciplinaryRecordFilter) returns (DisciplinaryRecordsResponse);
  rpc GetDisciplinaryRecordRequest(GetDisciplinaryRecordRequestID) returns (DisciplinaryRecordsResponseItem);
  rpc ConfirmDisciplinaryRecordRequest(ConfirmDisciplinaryRecord) returns (Empty);
  rpc PrintRecord(PrintRecordRequest) returns (DisciplinaryRecordCitizenResponse);

  //reports
  rpc GetCountRefuseAcceptCase(CountRefuseAcceptCaseRequest) returns (CountRefuseAcceptCaseResponse);
  rpc GetTotalPagesForCases(TotalPagesForCasesRequest) returns (TotalPagesForCasesResponse);
  rpc GetRawDataUserCases(RawDataUserCasesRequest) returns (RawDataUserCasesResponse);
  rpc CountScanned(Empty) returns (CountScannedResponse);
  rpc GetDisciplinaryRecordCitizen(DisciplinaryRecordCitizenRequest) returns (DisciplinaryRecordCitizenResponse);
  rpc GetDisciplinaryRecordCitizenWithCrimes(DisciplinaryRecordCitizenRequest) returns (DisciplinaryRecordCitizenCrimeResponse);
  rpc RunningCounts(RunningCountsRequest) returns (RunningCountsResponse);
  rpc RunningMyCounts(RunningCountsRequest) returns (RunningCountsResponse);
  rpc DashboradCounts(RunningCountsRequest) returns (RunningCountsResponse);
  rpc GetDisciplinaryDecisionReports(GetDisciplinaryDecisionReportsRequest) returns (GetDisciplinaryDecisionReportsResponse);
  rpc GetVerdictReports(GetVerdictReportsRequest) returns (GetVerdictReportsResponse);
  rpc GetJobGradeReports(GetJobGradeReportsRequest) returns (GetJobGradeReportsResponse);
  rpc GetMinistryReports(GetMinistryReportsRequest) returns (GetMinistryReportsResponse);
  rpc GetMetaReports(GetMetaReportsRequest) returns (GetMetaReportsResponse);
  rpc GetGenderReports(GetGenderReportsRequest) returns (GetGenderReportsResponse);
  rpc GetCaseTypesReports(GetCaseTypesReportsRequest) returns (GetCaseTypesReportsResponse);
  rpc GetCrimeTypesReports(GetCrimeTypesReportsRequest) returns (GetCrimeTypesReportsResponse);
  rpc GetCitizenMoreCasesReports(GetCitizenMoreCasesReportsRequest) returns (GetCitizenMoreCasesReportsResponse);
  rpc RunDashboard(RunDashboardRequest) returns (RunDashboardResponse);

  //Objections
  rpc CreateObjection(CreateObjectionRequest) returns (CreateObjectionRequest);
  rpc ListObjections(ObjectionsFilter) returns (ListObjectionsResponse);
  rpc GetObjection(GetObjectionRequest) returns (Objection);
  rpc UpdateObjection(UpdateObjectionRequest) returns (Objection);
  rpc DeleteObjection(DeleteObjectionRequest) returns (Empty);

  //Case Objections
  rpc ListCasesWithoutAllObjections(ObjectionTypeRequest) returns (GetCasesResponse);
  //search
  rpc Info(Empty) returns (MessageInfo);
  rpc ForceRefresh(ForceEntity) returns (MessageInfo);
}

// ============================================================================
// COMMON MESSAGES
// ============================================================================


//#############################################################################
// ===========================================================================
// EMPLOYEE TARGET REPORT MESSAGES
// ===========================================================================

message GetEmpTargetReportsRequest {
  optional int64 from_date = 1;
  optional int64 to_date = 2;
  optional string user_id = 3; // Optional filter by specific employee
}

message GetEmpTargetReportsResponse {
  repeated EmpTargetReportItem items = 1;
}

message EmpTargetReportItem {
  string user_id = 1;
  string user_name = 2;             // اسم الموظف
  string site_id = 3;              // معرف الجهة الحكومية
  string gov_id = 4;
  int64 target_date = 5;          // تاريخ الاستهداف
  string team_type = 6;

  int32 quality_cases = 7;
  int32 quality_case_defs = 8;
  int32 meta_pages = 9;
  int32 meta_docs = 10;
  int32 meta_cases = 11;
  int32 meta_case_defs = 12;
  int32 pages = 13;
  int32 docs = 14;
  int32 cases = 15;

}
//#############################################################################

// Empty message for operations that don't return data
message Empty {}

message MessageInfo {
  string Version = 1;
}

message  GetCasesInUserTaskRunRequest {
  string user_id = 1;
}

// ============================================================================
// CASE TYPES
// ============================================================================


// CaseType represents a type of legal case
// نوع القضية
message CaseType {
  string id = 1;
  string name = 2;
  optional string code = 4;
  string description = 5;
  SeverityLevel severity_level = 6;
  bool is_active = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// Request to list case types with filters
message ListCaseTypesRequest {
  optional bool is_active = 1;              // Filter by active status
  optional SeverityLevel severity_level = 2; // Filter by severity level
}

// Response containing list of case types
message ListCaseTypesResponse {
  repeated CaseType case_types = 1;
  int32 total = 2; // Total count of items
}

// Request to get a single case type by ID
message GetCaseTypeRequest {
  string id = 1;
}

// Request to create a new case type
message CreateCaseTypeRequest {
  CaseType case_type = 1;
}

// Request to update an existing case type
message UpdateCaseTypeRequest {
  CaseType case_type = 1;
}

// Request to delete a case type
message DeleteCaseTypeRequest {
  string id = 1;
}

// ============================================================================
// CRIME TYPES
// ============================================================================

// CrimeType represents a type of crime with legal details
// نوع الجريمة
message CrimeType {
  string id = 1;
  string name = 2;
  optional string code = 4;
  string description = 5;
  optional string legal_description = 6;   // الوصف القانوني
  optional string legal_articles = 7;      // المواد القانونية
  string legal_reference = 8; // المرجع القانوني
  optional string penalty_min = 9;         // الحد الأدنى للعقوبة
  optional string penalty_max = 10;        // الحد الأقصى للعقوبة
  optional CaseTypeCategory category = 11;
  SeverityLevel severity_level = 12;
  bool is_active = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

// Request to list crime types with filters
message ListCrimeTypesRequest {
  optional bool is_active = 3;              // Filter by active status
  optional SeverityLevel severity_level = 4; // Filter by severity level
  optional string category = 5;             // Filter by category
}

// Response containing list of crime types
message ListCrimeTypesResponse {
  repeated CrimeType crime_types = 1;
  int32 total = 2; // Total count of items
}

// Request to get a single crime type by ID
message GetCrimeTypeRequest {
  string id = 1;
}

// Request to create a new crime type
message CreateCrimeTypeRequest {
  CrimeType crime_type = 1;
}

// Request to update an existing crime type
message UpdateCrimeTypeRequest {
  CrimeType crime_type = 1;
}

// Request to delete a crime type
message DeleteCrimeTypeRequest {
  string id = 1;
}

// ============================================================================
// VERDICTS
// ============================================================================

// AdditionalField represents a custom field for verdict data
// حقل إضافي

message AdditionalField {
  string name = 1; // Field name (key)
  string label = 2; // Display label
  InputType type = 3; // Input type
  optional InputUnit unit = 4;           // Unit of measurement (e.g., "days", "years")
  optional double min = 5;            // Minimum value (for numbers)
  optional double max = 6;            // Maximum value (for numbers)
  optional string default_value = 7;  // Default value
  bool required = 8;
  optional string value = 9;     // Is this field required?
}

// Verdict represents a legal verdict or ruling
// الحكم
message Verdict {
  string id = 1;
  string name = 2;
  optional string code = 4;
  string description = 5;

  VerdictType verdict_type = 6; // نوع الحكم
  VerdictCategory category = 7; // فئة الحكم
  optional string legal_reference = 9;          // المرجع القانوني

  bool requires_additional_data = 10; // Does this verdict need extra data?
  repeated AdditionalField additional_fields = 11;
  bool is_active = 12;
  optional int32 display_order = 13;            // Order for display in UI
  int64 created_at = 14;
  int64 updated_at = 15;
}

// Request to list verdicts with filters
message ListVerdictsRequest {
  optional bool is_active = 3;              // Filter by active status
  optional VerdictType verdict_type = 4;    // Filter by verdict type
  optional VerdictCategory category = 5;    // Filter by category
}

// Response containing list of verdicts
message ListVerdictsResponse {
  repeated Verdict items = 1;
  int32 total = 2; // Total count of items
}

// Request to get a single verdict by ID
message GetVerdictRequest {
  string id = 1;
}

// Request to create a new verdict
message CreateVerdictRequest {
  Verdict verdict = 1;
}

// Request to update an existing verdict
message UpdateVerdictRequest {
  Verdict verdict = 1;
}

// Request to delete a verdict
message DeleteVerdictRequest {
  string id = 1;
}


// ============================================================================
// DISCIPLINARY DECISIONS
// ============================================================================

// الطعون و التظلمات
message CreateObjectionRequest {
  optional string id = 1;
  string case_id = 2;
  ObjectionType objection_type = 3;
  optional ObjectionStatus Objection_status = 4;
}
message Objection {
  string id = 1;
  string case_id = 2;
  optional string created_by = 3;
  optional string updated_by = 4;
  optional int64 created_at = 5;
  optional int64 updated_at = 6;
  optional ObjectionStatus status = 7;
  ObjectionType objection_type = 8;
  optional string objection_number = 9;
  optional int64 objection_date = 10;
  optional string description = 11;
  optional string formed_by_citizen_id = 12;
  repeated CaseDefendant defendant = 13;
}

message ObjectionsFilter {
  optional string case_id = 1;
  optional string created_by = 2;
  optional ObjectionStatus status = 3;
  optional string objection_number = 4;
  optional int64 objection_date = 5;
  optional int32 pageNumber = 6;
  optional int64 pageSize = 7;
  optional ObjectionType objection_type = 8;
  optional string formed_by_citizen_id = 9;
  optional int64 from = 10;
  optional int64 to = 11;
}
message ListObjectionsResponse {
  repeated Objection objections = 1;
  int64 total = 2;
}

message GetObjectionRequest {
  string id = 1;
}

message UpdateObjectionRequest {
  Objection objection = 1;
}

message DeleteObjectionRequest {
  string id = 1;
}

enum ObjectionStatus {
  OBJECTION_STATUS_UNSPECIFIED = 0;
  OBJECTION_STATUS_PENDING = 1;
  OBJECTION_STATUS_RESOLVED = 2;
  OBJECTION_STATUS_REJECTED = 3;
  OBJECTION_STATUS_DELETED = 4;
}

enum ObjectionType {
  OBJECTION_TYPE_UNSPECIFIED = 0;
  OBJECTION_TYPE_GRIEVANCE = 1;
  OBJECTION_TYPE_APPEAL = 2;
}

enum PrintRecordType {
  PRINT_RECORD_TYPE_UNSPECIFIED = 0;
  PRINT_RECORD_TYPE_CITIZEN = 1;
  PRINT_RECORD_TYPE_GOV = 2;
}

enum RecordStatus {
  RECORD_STATUS_UNSPECIFIED = 0;
  RECORD_STATUS_PENDING = 1;
  RECORD_STATUS_APPROVED = 2;
  RECORD_STATUS_REJECTED = 3;
}

// DisciplinaryDecision represents a disciplinary decision
// القرار التأديبي
message DisciplinaryDecision {
  string id = 1;
  string name = 2;
  optional string code = 3;
  string description = 4;
  DisciplinaryCategory category = 5;
  SeverityLevel severity_level = 6;
  string legal_reference = 7; // المادة القانونية المرجعية
  string penalty_description = 8; // وصف العقوبة
  optional string duration_min = 9;           // المدة الدنيا (مثلاً بالأيام)
  optional string duration_max = 10;           // المدة القصوى
  bool is_active = 11;
  optional int32 display_order = 12;
  optional int64 expiration_days = 13; // تاريخ الانتهاء
  repeated AdditionalField additional_fields = 14;
}

// Request to list disciplinary decisions with filters
message ListDisciplinaryDecisionsRequest {
  optional bool is_active = 1;              // Filter by active status
  optional DisciplinaryCategory category = 2; // Filter by category
}

// Response containing list of disciplinary decisions
message ListDisciplinaryDecisionsResponse {
  repeated DisciplinaryDecision disciplinary_decisions = 1;
  int32 total = 2;
}

// Request to get a single disciplinary decision by ID
message GetDisciplinaryDecisionRequest {
  string id = 1;
}

// Request to create a new disciplinary decision
message CreateDisciplinaryDecisionRequest {
  DisciplinaryDecision disciplinary_decision = 1;
}

// Request to update an existing disciplinary decision
message UpdateDisciplinaryDecisionRequest {
  DisciplinaryDecision disciplinary_decision = 1;
}

// Request to delete a disciplinary decision
message DeleteDisciplinaryDecisionRequest {
  string id = 1;
}

// ============================================================================
// CITIZENS
// ============================================================================

// Citizen represents a government employee or citizen involved in cases
// المواطن/الموظف الحكومي

message Citizen {
  string id = 1;
  string national_id = 2; // الرقم الوطني
  string full_name = 3; // الاسم الكامل
  string position = 4; // المنصب
  optional string department = 5;      // القسم - TODO: USE ENUM
  string government_id = 6; // معرف الجهة الحكومية
  optional string government_name = 7; // اسم الجهة الحكومية
  EmploymentStatus employment_status = 8; // حالة التوظيف
  optional string email = 9;
  optional string phone = 10;
  optional string address = 11;
  string notes = 12; // ملاحظات
  optional int64 birth_date = 13;      // تاريخ الميلاد
  optional int64 employment_date = 14; // تاريخ التوظيف
  int64 created_at = 15;
  int64 updated_at = 16;
  Gender gender = 17;
  JobGrade job_grade = 18; //الدرجه الوظبفية
  optional int32 age = 19;
}

// Request to list citizens with filters
message ListCitizensRequest {
  optional string government_id = 3;            // Filter by government entity
  optional EmploymentStatus employment_status = 4; // Filter by employment status
  optional string department = 5;               // Filter by department
}

// Response containing list of citizens
message ListCitizensResponse {
  repeated Citizen citizens = 1;
  int32 total = 2; // Total count of items
}

// Request to get a single citizen by ID
message GetCitizenRequest {
  string id = 1;
}

// Request to create a new citizen
message CreateCitizenRequest {
  Citizen citizen = 1;
}

// Request to update an existing citizen
message UpdateCitizenRequest {
  Citizen citizen = 1;
}

// Request to delete a citizen
message DeleteCitizenRequest {
  string id = 1;
}


// ============================================================================

// Case Request Tasks

message GetCaseRequest {
  string case_id = 1;
  optional bool with_tasks = 2;
  optional bool old_meta = 3;
}

message ListCasesRequest {
  optional CaseNumber case_no = 1;
  optional string case_application_id = 2;
  optional string created_by_user_id = 3;
  optional int64 created_at_from = 4;
  optional int64 created_at_to = 5;
  optional RequestType request_type = 6;
  optional string site_id = 7;
  optional string user_id = 8;
  optional string team_id = 9;
}

message RejectedCasesRequest {
  optional string created_by_user_id = 1;
  optional int64 created_at_from = 2;
  optional int64 created_at_to = 3;
  optional string site_id = 4;
  optional string team_id = 5;
  optional RequestType case_in_step = 6;
  optional string user_id = 7;
}

message RejectedCasesResponse {
  repeated RejectedCasesItem reject_cases = 1;
}
message RejectedCasesItem {
  string case_id = 1;
  repeated Document docs = 2;
  CaseNumber case_no = 3;
  string site_id = 4;
  string case_ref = 5;
}
message DocumentCase {
  string id = 1;
  DocumentStatus status = 2;
  optional string reject_reason = 3;
}

message ListHistoryCasesRequset {
  string case_id = 1;
}

message ListHistoryCasesResponse {
  repeated ListHistoryCase history = 1;
}

message ListHistoryCase {
  string user_name = 1;
  string user_id = 2;
  int64 task_date = 3;
  string description = 4;
  string notes = 5;
  int64 duration_entry = 6;
  RequestType request_type = 7;
  bool is_current = 8;
}


message ListCasesResponse {
  repeated CaseTask tasks = 1;
}

message CaseTask {
  string id = 1;
